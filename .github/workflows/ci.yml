name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install frappe-bench
        run: pip install frappe-bench

      - name: Initialize Bench
        run: |
          for i in {1..3}; do
            bench init \
              --skip-redis-config-generation \
              --skip-assets \
              --frappe-branch version-15 \
              --python "$(which python)" \
              ~/frappe-bench && break
            echo "Attempt $i failed, retrying in 10s..."
            rm -rf ~/frappe-bench
            sleep 10
          done
      - name: Install apps
        run: |
          cd ~/frappe-bench
          bench get-app erpnext --branch version-15
          bench get-app incident_management_system $GITHUB_WORKSPACE
      - name: Create site and install apps
        run: |
          cd ~/frappe-bench
          bench new-site test_site \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test_site set-config server_script_enabled true
          bench --site test_site install-app erpnext
          bench --site test_site install-app incident_management_system
      - name: Run Tests
        run: |
          cd ~/frappe-bench
          bench --site test_site run-tests --app incident_management_system
